function slugify(s) { return (s || "").toString().trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function todayKey() { return new Date().toISOString().slice(0, 10); }
function weekKey() {
  const d = new Date(); const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
}
function regToAuthEmail(reg) { return `${slugify(reg)}${AUTH_DOMAIN_SUFFIX}`; }

function compressImage(file, maxSize = 220, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(b => resolve(b), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Tiny inline icon set (emoji-based, no external deps) ---------- */
const I = {
  user: "👤", lock: "🔒", mail: "✉️", phone: "📞", hash: "#️⃣", upload: "⬆️",
  book: "📖", file: "📄", video: "🎥", cap: "🎓", trophy: "🏆", home: "🏠",
  shield: "🛡️", logout: "🚪", check: "✔️", x: "✖️", plus: "➕", trash: "🗑️",
  award: "🏅", library: "📚", clipboard: "📋", info: "ℹ️", menu: "☰",
  chevron: "›", star: "⭐", link: "🔗", roster: "🗂️", megaphone: "📢",
};
function Ic({ n, size = 15 }) { return <span style={{ fontSize: size, lineHeight: 1 }}>{I[n] || ""}</span>; }

function Seal({ size = 44 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: "radial-gradient(circle at 32% 28%, #ffffff, #cfe3f7 55%, #9dc0e6 100%)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 6px rgba(10,38,71,0.35), inset 0 0 0 2px rgba(20,65,122,0.25)", flexShrink: 0 }}>
      <Ic n="cap" size={size * 0.45} />
    </div>
  );
}
function Field({ icon, ...props }) {
  return (
    <div style={{ position: "relative", marginBottom: 14 }}>
      {icon && <span style={{ position: "absolute", left: 12, top: 12, color: "#8a94a6" }}><Ic n={icon} size={14} /></span>}

    </div>

}
function Button({ children, variant = "primary", style, ...props }) {
  const base = { padding: "11px 18px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "inherit", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 };
  const variants = {
    primary: { background: PALETTE.navy, color: "#fff" },
    gold: { background: PALETTE.gold, color: PALETTE.navyDeep, border: `1.5px solid ${PALETTE.navy}` },
    ghost: { background: "transparent", color: PALETTE.navy, border: `1px solid ${PALETTE.navy}` },
    danger: { background: "#fff", color: PALETTE.coral, border: `1px solid ${PALETTE.coral}` },
    teal: { background: PALETTE.teal, color: "#fff" },
  };
  return <button {...props} style={{ ...base, ...variants[variant], ...style }} onMouseEnter={e => e.currentTarget.style.opacity = 0.85} onMouseLeave={e => e.currentTarget.style.opacity = 1}>{children}</button>;
}
function Badge({ children, tone = "gold" }) {
  const tones = { gold: { bg: "#dbe9fa", fg: PALETTE.navy }, teal: { bg: "#dbeaf5", fg: "#124a72" }, coral: { bg: "#f6dedb", fg: "#8f2f27" }, navy: { bg: "#e2e7ee", fg: PALETTE.navy } };
  const t = tones[tone];
  return <span style={{ background: t.bg, color: t.fg, fontSize: 11.5, fontWeight: 700, padding: "3px 9px", borderRadius: 20, letterSpacing: 0.3, textTransform: "uppercase" }}>{children}</span>;
}
function Card({ children, style }) {

}

/* ============================================================ */
function App() {
  const [authReady, setAuthReady] = useState(false);
  const [fbUser, setFbUser] = useState(null);
  const [profile, setProfile] = useState(null); // Firestore user doc
  const [library, setLibrary] = useState({ notes: [], pastpapers: [], books: [], videos: [], exams: [] });
  const [quizzes, setQuizzes] = useState([]);
  const [leaderboard, setLeaderboard] = useState({});
  const [announcements, setAnnouncements] = useState([]);
  const [schoolInfo, setSchoolInfo] = useState(null);

  const [page, setPage] = useState("home");
  const [authMode, setAuthMode] = useState("login");
  const [navOpen, setNavOpen] = useState(false);

  // Watch Firebase Auth state
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setFbUser(u);
      if (u) {
        const doc = await db.collection("users").doc(u.uid).get();
        setProfile(doc.exists ? { id: u.uid, ...doc.data() } : null);
      } else {
        setProfile(null);
      }
      setAuthReady(true);
    });
    return unsub;
  }, []);

  // Load shared collections once
  useEffect(() => {
    (async () => {
      const libDoc = await db.collection("library").doc("content").get();
      setLibrary(libDoc.exists ? libDoc.data() : { notes: [], pastpapers: [], books: [], videos: [], exams: [] });

      const qSnap = await db.collection("quizzes").orderBy("date", "desc").get();
      setQuizzes(qSnap.docs.map(d => ({ id: d.id, ...d.data() })));

      const lbSnap = await db.collection("leaderboard").get();
      const lb = {}; lbSnap.docs.forEach(d => lb[d.id] = d.data());
      setLeaderboard(lb);

      const annSnap = await db.collection("announcements").orderBy("date", "desc").get();
      setAnnouncements(annSnap.docs.map(d => ({ id: d.id, ...d.data() })));

      const infoDoc = await db.collection("meta").doc("schoolInfo").get();
      if (infoDoc.exists) setSchoolInfo(infoDoc.data());
      else {
        const info = {
          about: "Lumumba Secondary School is one of the largest secondary schools in Zanzibar, located in Saateni, close to Stone Town. Its motto is \"Committed to excellence in both academic and moral achievements,\" and it offers Form I through Form VI.",
          history: "The school was founded in 1958 as King George VI College. After the 1964 Zanzibar Revolution it was renamed Lumumba College in honour of Congolese leader Patrice Lumumba, and later became Lumumba Secondary School as it is known today.",
          contacts: "Address: Saateni St, Lumumba, Zanzibar | Email: info@lumumba.ac.tz | Phone: +255 654 797 531",
        };
        await db.collection("meta").doc("schoolInfo").set(info);
        setSchoolInfo(info);
      }
    })();
  }, []);

  const refreshLibrary = useCallback(async () => {
    const d = await db.collection("library").doc("content").get();
    setLibrary(d.exists ? d.data() : { notes: [], pastpapers: [], books: [], videos: [], exams: [] });
  }, []);
  const refreshQuizzes = useCallback(async () => {
    const s = await db.collection("quizzes").orderBy("date", "desc").get();
    setQuizzes(s.docs.map(d => ({ id: d.id, ...d.data() })));
  }, []);
  const refreshLeaderboard = useCallback(async () => {
    const s = await db.collection("leaderboard").get();
    const lb = {}; s.docs.forEach(d => lb[d.id] = d.data());
    setLeaderboard(lb);
  }, []);
  const refreshAnnouncements = useCallback(async () => {
    const s = await db.collection("announcements").orderBy("date", "desc").get();
    setAnnouncements(s.docs.map(d => ({ id: d.id, ...d.data() })));
  }, []);
  const refreshProfile = useCallback(async () => {
    if (!fbUser) return;
    const d = await db.collection("users").doc(fbUser.uid).get();
    setProfile(d.exists ? { id: fbUser.uid, ...d.data() } : null);
  }, [fbUser]);

  function goto(p) { setPage(p); setNavOpen(false); }
  function logout() { auth.signOut(); setPage("home"); }

  if (!authReady || !schoolInfo) {
    return (
      <div style={{ minHeight: "100vh", background: PALETTE.navyDeep, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 16, fontFamily: "Georgia, serif" }}>
        <Seal size={64} /><div style={{ color: "#fff", letterSpacing: 1 }}>Loading Lumumba Portal...</div>
      </div>
    );
  }

  const session = fbUser && profile ? profile : null;

  return (
    <div style={{ minHeight: "100vh", background: PALETTE.ivory, fontFamily: "'Work Sans','Segoe UI',sans-serif", color: PALETTE.navyDeep }}>
      <TopBar session={session} onNav={goto} onLogout={logout} navOpen={navOpen} setNavOpen={setNavOpen} />
      <div style={{ maxWidth: 1080, margin: "0 auto", padding: "28px 18px 60px" }}>
        {page === "home" && <HomePage session={session} goto={goto} announcements={announcements} leaderboard={leaderboard} />}
        {page === "auth" && <AuthPage mode={authMode} setMode={setAuthMode} onLoggedIn={() => setPage("dashboard")} />}
        {page === "dashboard" && session && <Dashboard session={session} refreshProfile={refreshProfile} leaderboard={leaderboard} />}
        {page === "dashboard" && !session && <AuthPage mode="login" setMode={setAuthMode} onLoggedIn={() => setPage("dashboard")} />}
        {page === "library" && <LibraryPage session={session} library={library} refresh={refreshLibrary} />}
        {page === "news" && <AnnouncementsPage session={session} announcements={announcements} refresh={refreshAnnouncements} />}
        {page === "quiz" && <QuizPage session={session} quizzes={quizzes} leaderboard={leaderboard} refreshQuizzes={refreshQuizzes} refreshLeaderboard={refreshLeaderboard} />}
        {page === "about" && <AboutPage info={schoolInfo} />}
        {page === "admin" && session?.role === "admin" && <AdminPage session={session} schoolInfo={schoolInfo} setSchoolInfo={setSchoolInfo} />}
      </div>
      <footer style={{ textAlign: "center", padding: "22px 16px 34px", color: "#7c8698", fontSize: 12.5, borderTop: "1px solid #e2e7ee" }}>
        Lumumba Secondary School — Digital Portal &nbsp;•&nbsp; Created by <strong>FARID HAJI MOH'D</strong>, President of the Student Government
      </footer>
    </div>
  );
}

/* ---------------- Top Bar ---------------- */

    { key: "news", label: "News & Events", icon: "megaphone" },

    { key: "quiz", label: "Quizzes", icon: "clipboard" },

    ...(session?.role === "admin" ? [{ key: "admin", label: "Admin", icon: "shield" }] : []),
  ];
  return (
    <div style={{ background: PALETTE.navyDeep, color: "#fff", position: "sticky", top: 0, zIndex: 20 }}>
      <div style={{ maxWidth: 1080, margin: "0 auto", padding: "12px 18px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>

          <Seal size={38} />
          <div>
            <div style={{ fontFamily: "Georgia,serif", fontSize: 16, fontWeight: 700, lineHeight: 1.1 }}>Lumumba Secondary</div>
            <div style={{ fontSize: 10.5, letterSpacing: 1.5, color: "#cfe3f7", textTransform: "uppercase" }}>Digital Portal</div>
          </div>
        </div>
        <div className="desktop-nav" style={{ display: "none", gap: 6, alignItems: "center" }}>

            : <Button variant="gold" onClick={() => onNav("auth")} style={{ marginTop: 8 }}>Login / Register</Button>}
        </div>
      )}
      <style>{`@media (min-width: 860px){ .desktop-nav{ display:flex !important; } }`}</style>
    </div>
  );
}

function AuthPage({ mode, setMode, onLoggedIn }) {
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState(null);
  const [loginReg, setLoginReg] = useState("");
  const [loginPass, setLoginPass] = useState("");

  const [role, setRole] = useState("student");
  const [fullName, setFullName] = useState("");
  const [regNumber, setRegNumber] = useState("");
  const [form, setForm] = useState("Form I");
  const [dob, setDob] = useState("");
  const [email, setEmail] = useState("");
  const [phone, setPhone] = useState("");
  const [pass1, setPass1] = useState("");
  const [pass2, setPass2] = useState("");
  const [photoFile, setPhotoFile] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const fileRef = useRef();

  async function handlePhoto(e) {
    const f = e.target.files[0]; if (!f) return;
    const blob = await compressImage(f);
    setPhotoFile(blob);
    setPhotoPreview(URL.createObjectURL(blob));
  }

  async function handleLogin() {
    setMsg(null);
    if (!loginReg || !loginPass) { setMsg({ t: "err", m: "Enter your registration number and password." }); return; }
    setLoading(true);
    try {
      const authEmail = regToAuthEmail(loginReg);
      const cred = await auth.signInWithEmailAndPassword(authEmail, loginPass);
      const doc = await db.collection("users").doc(cred.user.uid).get();
      if (!doc.exists) { setMsg({ t: "err", m: "Account record not found. Contact the admin." }); setLoading(false); return; }
      const data = doc.data();
      if (data.status === "pending") { setMsg({ t: "err", m: "Your account is still awaiting approval from the Super Admin." }); await auth.signOut(); setLoading(false); return; }
      if (data.status === "rejected") { setMsg({ t: "err", m: "Your account was not approved. Contact the admin." }); await auth.signOut(); setLoading(false); return; }
      onLoggedIn();
    } catch (err) {
      if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential" || err.code === "auth/invalid-login-credentials") setMsg({ t: "err", m: "Account not found. Check your registration number or register." });
      else if (err.code === "auth/wrong-password") setMsg({ t: "err", m: "Incorrect password." });
      else setMsg({ t: "err", m: "Login failed: " + err.message });
    }
    setLoading(false);
  }

  async function handleRegister() {
    setMsg(null);
    if (!fullName || !regNumber || !dob || !pass1) { setMsg({ t: "err", m: "Fill in full name, date of birth, registration number and password." }); return; }
    if (pass1.length < 6) { setMsg({ t: "err", m: "Password should be at least 6 characters." }); return; }
    if (pass1 !== pass2) { setMsg({ t: "err", m: "Passwords do not match." }); return; }
    setLoading(true);
    try {
      // Roster check (only enforced once the admin has uploaded a roster)
      const rosterSnap = await db.collection("roster").where("regNumber", "==", regNumber.trim()).where("role", "==", role).limit(1).get();
      const anyRoster = await db.collection("roster").limit(1).get();
      if (!anyRoster.empty && rosterSnap.empty) {
        setMsg({ t: "err", m: "This registration number was not found on the official school roster. Contact the Super Admin if this is an error." });
        setLoading(false); return;
      }

      const authEmail = regToAuthEmail(regNumber);
      const isAdminSeed = regNumber.trim().toUpperCase() === ADMIN_REG;
      const cred = await auth.createUserWithEmailAndPassword(authEmail, pass1);

      let photoURL = null;
      if (photoFile) {
        const ref = storage.ref().child(`photos/${cred.user.uid}.jpg`);
        await ref.put(photoFile);
        photoURL = await ref.getDownloadURL();
      }

      await db.collection("users").doc(cred.user.uid).set({
        fullName: fullName.trim(), regNumber: regNumber.trim(),
        role: isAdminSeed ? "admin" : role,
        form: role === "student" ? form : "Teacher", dob,
        email: email.trim(), phone: phone.trim(),
        photoURL, status: isAdminSeed ? "approved" : "pending",
        schoolEmail: null, createdAt: Date.now(),
      });

      if (isAdminSeed) {
        setMsg({ t: "ok", m: "Super Admin account created and approved automatically. You can log in now." });
      } else {
        setMsg({ t: "ok", m: "Registered! Your account is awaiting approval from the Super Admin. You'll be able to log in once approved." });
      }
      await auth.signOut();
      setFullName(""); setRegNumber(""); setDob(""); setEmail(""); setPhone(""); setPass1(""); setPass2(""); setPhotoFile(null); setPhotoPreview(null);
      if (fileRef.current) fileRef.current.value = "";
      setMode("login");
    } catch (err) {
      if (err.code === "auth/email-already-in-use") setMsg({ t: "err", m: "This registration number is already registered." });
      else setMsg({ t: "err", m: "Registration failed: " + err.message });
    }
    setLoading(false);
  }

  return (
    <div style={{ maxWidth: 460, margin: "0 auto" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, background: "#e2e7ee", padding: 4, borderRadius: 10 }}>
        <button onClick={() => { setMode("login"); setMsg(null); }} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13.5, background: mode === "login" ? "#fff" : "transparent", color: PALETTE.navy }}>Login</button>
        <button onClick={() => { setMode("register"); setMsg(null); }} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13.5, background: mode === "register" ? "#fff" : "transparent", color: PALETTE.navy }}>Register</button>
      </div>

      {msg && <div style={{ padding: "10px 14px", borderRadius: 8, marginBottom: 14, fontSize: 13.5, background: msg.t === "ok" ? "#dbeaf5" : "#f6dedb", color: msg.t === "ok" ? "#124a72" : "#8f2f27" }}>{msg.m}</div>}

      {mode === "login" ? (
        <Card>
          <h2 style={{ fontSize: 19, marginBottom: 4 }}>Welcome back</h2>
          <p style={{ fontSize: 12.5, color: "#8a94a6", marginBottom: 16 }}>Sign in with your registration number.</p>
          <Field icon="hash" placeholder="Registration number" value={loginReg} onChange={e => setLoginReg(e.target.value)} />
          <Field icon="lock" type="password" placeholder="Password" value={loginPass} onChange={e => setLoginPass(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} />
          <Button onClick={handleLogin} variant="primary" style={{ width: "100%" }} disabled={loading}>{loading ? "Logging in..." : "Login"}</Button>
        </Card>
      ) : (
        <Card>
          <h2 style={{ fontSize: 19, marginBottom: 4 }}>Create a New Account</h2>
          <p style={{ fontSize: 12.5, color: "#8a94a6", marginBottom: 16 }}>Registering with <strong>{ADMIN_REG}</strong> as the registration number creates the Super Admin account automatically (first time only). Everyone else awaits approval.</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {[["student", "Student"], ["teacher", "Teacher"]].map(([v, l]) => (
              <button type="button" key={v} onClick={() => setRole(v)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${role === v ? PALETTE.navy : "#dde1e7"}`, background: role === v ? PALETTE.navy : "#fff", color: role === v ? "#fff" : PALETTE.navy }}>{l}</button>
            ))}
          </div>
          <Field icon="user" placeholder="Full name" value={fullName} onChange={e => setFullName(e.target.value)} />
          <Field icon="hash" placeholder={role === "student" ? "Registration number" : "Employee number"} value={regNumber} onChange={e => setRegNumber(e.target.value)} />
          {role === "student" && (
            <select value={form} onChange={e => setForm(e.target.value)} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginBottom: 14, fontFamily: "inherit", fontSize: 14.5 }}>
              {FORMS.map(f => <option key={f}>{f}</option>)}
            </select>
          )}
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, color: "#67707f", display: "block", marginBottom: 6 }}>Date of birth</label>
            <input type="date" value={dob} onChange={e => setDob(e.target.value)} style={{ width: "100%", boxSizing: "border-box", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", fontSize: 14.5, fontFamily: "inherit" }} />
          </div>
          <Field icon="mail" type="email" placeholder="Personal email (optional)" value={email} onChange={e => setEmail(e.target.value)} />
          <Field icon="phone" placeholder="Phone number" value={phone} onChange={e => setPhone(e.target.value)} />
          <Field icon="lock" type="password" placeholder="Create password" value={pass1} onChange={e => setPass1(e.target.value)} />
          <Field icon="lock" type="password" placeholder="Confirm password" value={pass2} onChange={e => setPass2(e.target.value)} />
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 12.5, color: "#67707f", display: "block", marginBottom: 6 }}>Passport-size photo (optional now)</label>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              {photoPreview && <img src={photoPreview} alt="passport" style={{ width: 52, height: 52, borderRadius: 8, objectFit: "cover", border: "1px solid #ddd" }} />}
              <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{ fontSize: 12.5 }} />
            </div>
          </div>
          <Button onClick={handleRegister} variant="primary" style={{ width: "100%" }} disabled={loading}>{loading ? "Submitting..." : "Register"}</Button>
        </Card>
      )}
    </div>
  );
}

/* ---------------- Dashboard ---------------- */

          {results.length === 0 ? <p style={{ fontSize: 13.5, color: "#8a94a6" }}>No results yet. When the admin posts them, they'll appear here — visible only to you.</p> : (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>

              <tbody>
                {results.map((r, i) => (
                  <tr key={i} style={{ borderTop: "1px solid #f1efe8" }}>

                    <td><Badge tone={r.grade === "A" ? "teal" : r.grade === "F" ? "coral" : "gold"}>{r.grade}</Badge></td>
                    <td>{r.term}</td>

      {session.role === "teacher" && (

      )}

  );
}

/* ---------------- Library ---------------- */
const LIB_TABS = [
  { key: "notes", label: "Notes", icon: "file" }, { key: "pastpapers", label: "Past Papers", icon: "clipboard" },
  { key: "books", label: "Books", icon: "book" }, { key: "videos", label: "Video Lessons", icon: "video" },
  { key: "exams", label: "Exams", icon: "cap" }, { key: "resources", label: "Study Links", icon: "link" },
];

function LibraryPage({ session, library, refresh }) {
  const [tab, setTab] = useState("notes");
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState(""); const [subject, setSubject] = useState("");
  const [form, setForm] = useState("Form I"); const [link, setLink] = useState("");
  const canContribute = session && (session.role === "teacher" || session.role === "admin");

  async function addItem() {
    if (!title || !link) return;
    const current = library[tab] || [];
    const updated = [{ title, subject, form, link, by: session.fullName, date: Date.now() }, ...current];
    await db.collection("library").doc("content").set({ [tab]: updated }, { merge: true });
    await refresh();
    setTitle(""); setSubject(""); setLink(""); setShowForm(false);
  }

  if (tab === "resources") {
    return (
      <div>
        <h2 style={{ fontSize: 22, marginBottom: 14 }}>Digital Library</h2>
        <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
          {LIB_TABS.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={{ padding: "8px 14px", borderRadius: 20, border: `1.5px solid ${tab === t.key ? PALETTE.navy : "#dde1e7"}`, background: tab === t.key ? PALETTE.navy : "#fff", color: tab === t.key ? "#fff" : PALETTE.navy, cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Ic n={t.icon} size={13} /> {t.label}</button>)}
        </div>
        <p style={{ fontSize: 12.5, color: "#8a94a6", marginBottom: 14 }}>Official Tanzania & Zanzibar education resources aligned with the new TIE competence-based curriculum.</p>
        <div style={{ display: "grid", gap: 10 }}>
          {EXTERNAL_RESOURCES.map((r, i) => (
            <Card key={i} style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, background: "#eef1f5", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Ic n="link" size={17} /></div>
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 14.5, fontWeight: 600 }}>{r.title}</div><div style={{ fontSize: 12, color: "#8a94a6" }}>{r.desc}</div></div>
              <a href={r.link} target="_blank" rel="noreferrer"><Button variant="gold" style={{ padding: "8px 14px" }}>Open</Button></a>
            </Card>
          ))}
        </div>
      </div>
    );
  }

  const items = library[tab] || [];
  const tabDef = LIB_TABS.find(t => t.key === tab);

  return (
    <div>
      <h2 style={{ fontSize: 22, marginBottom: 14 }}>Digital Library</h2>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {LIB_TABS.map(t => <button key={t.key} onClick={() => { setTab(t.key); setShowForm(false); }} style={{ padding: "8px 14px", borderRadius: 20, border: `1.5px solid ${tab === t.key ? PALETTE.navy : "#dde1e7"}`, background: tab === t.key ? PALETTE.navy : "#fff", color: tab === t.key ? "#fff" : PALETTE.navy, cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Ic n={t.icon} size={13} /> {t.label}</button>)}
      </div>
      {canContribute && (
        <div style={{ marginBottom: 16 }}>
          {!showForm ? <Button variant="teal" onClick={() => setShowForm(true)}><Ic n="plus" size={13} /> Add {tabDef.label}</Button> : (
            <Card style={{ marginBottom: 10 }}>
              <Field placeholder="Title (e.g. Physics Form III - Radiation)" value={title} onChange={e => setTitle(e.target.value)} />
              <Field placeholder="Subject (e.g. Physics)" value={subject} onChange={e => setSubject(e.target.value)} />
              <select value={form} onChange={e => setForm(e.target.value)} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginBottom: 14, fontSize: 14.5 }}>{[...FORMS, "All Forms"].map(f => <option key={f}>{f}</option>)}</select>
              <Field placeholder="Link (Google Drive / YouTube / URL)" value={link} onChange={e => setLink(e.target.value)} />
              <div style={{ display: "flex", gap: 8 }}><Button onClick={addItem} variant="primary">Save</Button><Button variant="ghost" onClick={() => setShowForm(false)}>Cancel</Button></div>
            </Card>
          )}
        </div>
      )}
      {items.length === 0 ? <Card><p style={{ fontSize: 13.5, color: "#8a94a6" }}>Nothing here yet. {canContribute ? "Add the first item!" : "Teachers will post content soon."}</p></Card> : (
        <div style={{ display: "grid", gap: 10 }}>
          {items.map((it, i) => (
            <Card key={i} style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, background: "#eef1f5", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Ic n={tabDef.icon} size={17} /></div>
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 14.5, fontWeight: 600 }}>{it.title}</div><div style={{ fontSize: 12, color: "#8a94a6" }}>{it.subject} {it.form ? `• ${it.form}` : ""} {it.by ? `• by ${it.by}` : ""}</div></div>
              <a href={it.link} target="_blank" rel="noreferrer"><Button variant="gold" style={{ padding: "8px 14px" }}>Open</Button></a>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Quiz ---------------- */
function QuizPage({ session, quizzes, leaderboard, refreshQuizzes, refreshLeaderboard }) {
  const [active, setActive] = useState(null); const [answers, setAnswers] = useState({}); const [result, setResult] = useState(null);
  const canCreate = session && (session.role === "teacher" || session.role === "admin");
  const [showCreate, setShowCreate] = useState(false);
  const [qTitle, setQTitle] = useState(""); const [qSubject, setQSubject] = useState("");
  const [questions, setQuestions] = useState([{ q: "", options: ["", "", "", ""], answer: 0 }]);

  function addQuestion() { setQuestions([...questions, { q: "", options: ["", "", "", ""], answer: 0 }]); }
  function updateQ(i, field, val) { const qs = [...questions]; qs[i][field] = val; setQuestions(qs); }
  function updateOpt(qi, oi, val) { const qs = [...questions]; qs[qi].options[oi] = val; setQuestions(qs); }

  async function saveQuiz() {
    if (!qTitle || questions.some(q => !q.q || q.options.some(o => !o))) return;
    await db.collection("quizzes").add({ title: qTitle, subject: qSubject, questions, by: session.fullName, date: Date.now() });
    await refreshQuizzes();
    setQTitle(""); setQSubject(""); setQuestions([{ q: "", options: ["", "", "", ""], answer: 0 }]); setShowCreate(false);
  }

  function startQuiz(quiz) { setActive(quiz); setAnswers({}); setResult(null); }

  async function submitQuiz() {
    let score = 0;
    active.questions.forEach((q, i) => { if (answers[i] === q.answer) score++; });
    const points = score * 10;
    setResult({ score, total: active.questions.length, points });
    if (session && session.role === "student") {
      const dKey = todayKey(), wKey = weekKey();
      const ref = db.collection("leaderboard").doc(session.id);
      const doc = await ref.get();
      const prev = doc.exists ? doc.data() : { name: session.fullName, totalPoints: 0, dailyPoints: 0, dailyDate: dKey, weeklyPoints: 0, weekKey: wKey };
      if (prev.dailyDate !== dKey) { prev.dailyPoints = 0; prev.dailyDate = dKey; }
      if (prev.weekKey !== wKey) { prev.weeklyPoints = 0; prev.weekKey = wKey; }
      prev.name = session.fullName;
      prev.totalPoints = (prev.totalPoints || 0) + points;
      prev.dailyPoints = (prev.dailyPoints || 0) + points;
      prev.weeklyPoints = (prev.weeklyPoints || 0) + points;
      await ref.set(prev);
      await refreshLeaderboard();
    }
  }

  const dailyTop = Object.entries(leaderboard).map(([id, v]) => ({ id, ...v })).filter(v => v.dailyDate === todayKey()).sort((a, b) => (b.dailyPoints || 0) - (a.dailyPoints || 0)).slice(0, 10);
  const weeklyTop = Object.entries(leaderboard).map(([id, v]) => ({ id, ...v })).filter(v => v.weekKey === weekKey()).sort((a, b) => (b.weeklyPoints || 0) - (a.weeklyPoints || 0)).slice(0, 10);

  if (active) {
    return (
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <Button variant="ghost" onClick={() => setActive(null)} style={{ marginBottom: 14 }}>← Back</Button>
        <h2 style={{ fontSize: 20, marginBottom: 4 }}>{active.title}</h2>
        <p style={{ fontSize: 12.5, color: "#8a94a6", marginBottom: 18 }}>{active.subject}</p>
        {!result ? (
          <>
            {active.questions.map((q, i) => (
              <Card key={i} style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 14.5, fontWeight: 600, marginBottom: 10 }}>{i + 1}. {q.q}</div>
                <div style={{ display: "grid", gap: 8 }}>
                  {q.options.map((o, oi) => (
                    <label key={oi} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${answers[i] === oi ? PALETTE.teal : "#e2e5ea"}`, background: answers[i] === oi ? "#eaf3fa" : "#fff", cursor: "pointer", fontSize: 13.5 }}>
                      <input type="radio" name={`q${i}`} checked={answers[i] === oi} onChange={() => setAnswers({ ...answers, [i]: oi })} /> {o}
                    </label>
                  ))}
                </div>
              </Card>
            ))}
            <Button variant="primary" onClick={submitQuiz} style={{ width: "100%" }}>Submit Answers</Button>
          </>
        ) : (
          <Card style={{ textAlign: "center", padding: 30 }}>
            <div style={{ marginBottom: 10 }}><Ic n="star" size={34} /></div>
            <h3 style={{ fontSize: 20 }}>You scored {result.score}/{result.total}</h3>
            <p style={{ color: "#8a94a6", marginTop: 6 }}>+{result.points} points added</p>
            <Button variant="primary" onClick={() => setActive(null)} style={{ marginTop: 16 }}>Back to Quizzes</Button>
          </Card>
        )}
      </div>
    );
  }

  return (
    <div>
      <h2 style={{ fontSize: 22, marginBottom: 14 }}>Quizzes</h2>
      {canCreate && (
        <div style={{ marginBottom: 18 }}>
          {!showCreate ? <Button variant="teal" onClick={() => setShowCreate(true)}><Ic n="plus" size={13} /> Create New Quiz</Button> : (
            <Card>
              <Field placeholder="Quiz title" value={qTitle} onChange={e => setQTitle(e.target.value)} />
              <Field placeholder="Subject" value={qSubject} onChange={e => setQSubject(e.target.value)} />
              {questions.map((q, qi) => (
                <div key={qi} style={{ border: "1px solid #eee", borderRadius: 8, padding: 12, marginBottom: 10 }}>
                  <Field placeholder={`Question ${qi + 1}`} value={q.q} onChange={e => updateQ(qi, "q", e.target.value)} />
                  {q.options.map((o, oi) => (
                    <div key={oi} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <input type="radio" checked={q.answer === oi} onChange={() => updateQ(qi, "answer", oi)} />
                      <input value={o} onChange={e => updateOpt(qi, oi, e.target.value)} placeholder={`Option ${oi + 1}`} style={{ flex: 1, padding: 9, borderRadius: 6, border: "1px solid #d9dde4", fontSize: 13.5 }} />
                    </div>
                  ))}
                  <div style={{ fontSize: 11.5, color: "#8a94a6" }}>Select the radio button of the correct answer</div>
                </div>
              ))}
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}><Button variant="ghost" onClick={addQuestion}><Ic n="plus" size={12} /> Add Question</Button></div>
              <div style={{ display: "flex", gap: 8 }}><Button onClick={saveQuiz} variant="primary">Save Quiz</Button><Button variant="ghost" onClick={() => setShowCreate(false)}>Cancel</Button></div>
            </Card>
          )}
        </div>
      )}
      <div style={{ display: "grid", gap: 10, marginBottom: 26 }}>
        {quizzes.length === 0 && <Card><p style={{ fontSize: 13.5, color: "#8a94a6" }}>No quizzes yet. {canCreate ? "Create the first one!" : "Teachers will add quizzes soon."}</p></Card>}
        {quizzes.map(q => (
          <Card key={q.id} style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flex: 1 }}><div style={{ fontSize: 14.5, fontWeight: 600 }}>{q.title}</div><div style={{ fontSize: 12, color: "#8a94a6" }}>{q.subject} • {q.questions.length} questions</div></div>
            <Button variant="gold" onClick={() => startQuiz(q)}>Start</Button>
          </Card>
        ))}
      </div>
      <div className="lb-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <LeaderboardCard title="Top 10 — Today" data={dailyTop} field="dailyPoints" />
        <LeaderboardCard title="Top 10 — This Week" data={weeklyTop} field="weeklyPoints" />
      </div>
      <style>{`@media (max-width: 640px){ .lb-grid{ grid-template-columns: 1fr !important; } }`}</style>
    </div>
  );
}
function LeaderboardCard({ title, data, field }) {
  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}><Ic n="trophy" size={15} /><h3 style={{ fontSize: 14.5 }}>{title}</h3></div>
      {data.length === 0 ? <p style={{ fontSize: 12.5, color: "#8a94a6" }}>No scores yet.</p> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {data.map((u, i) => (<div key={u.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}><span style={{ width: 18, color: "#aaa", fontWeight: 700 }}>{i + 1}</span><span style={{ flex: 1 }}>{u.name}</span><Badge tone="gold">{u[field] || 0}</Badge></div>))}
        </div>
      )}
    </Card>
  );
}

/* ---------------- News & Events ---------------- */
function AnnouncementsPage({ session, announcements, refresh }) {
  const [filter, setFilter] = useState("all"); const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState(""); const [category, setCategory] = useState("news");
  const [body, setBody] = useState(""); const [eventDate, setEventDate] = useState(""); const [link, setLink] = useState("");
  const canPost = session && (session.role === "teacher" || session.role === "admin");

  async function postAnnouncement() {
    if (!title || !body) return;
    await db.collection("announcements").add({ title, category, body, eventDate: category === "event" ? eventDate : "", link, by: session.fullName, date: Date.now() });
    await refresh();
    setTitle(""); setBody(""); setEventDate(""); setLink(""); setShowForm(false);
  }
  async function deleteAnnouncement(id) { await db.collection("announcements").doc(id).delete(); await refresh(); }

  const filtered = (announcements || []).filter(a => filter === "all" || a.category === filter);

  return (
    <div>
      <h2 style={{ fontSize: 22, marginBottom: 14 }}>News & Events</h2>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {[["all", "All"], ["news", "News"], ["event", "Events"]].map(([v, l]) => (
          <button key={v} onClick={() => setFilter(v)} style={{ padding: "8px 14px", borderRadius: 20, border: `1.5px solid ${filter === v ? PALETTE.navy : "#dde1e7"}`, background: filter === v ? PALETTE.navy : "#fff", color: filter === v ? "#fff" : PALETTE.navy, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>{l}</button>
        ))}
      </div>
      {canPost && (
        <div style={{ marginBottom: 18 }}>
          {!showForm ? <Button variant="teal" onClick={() => setShowForm(true)}><Ic n="plus" size={13} /> Post News / Event</Button> : (
            <Card style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
                {[["news", "News"], ["event", "Event"]].map(([v, l]) => (<button key={v} onClick={() => setCategory(v)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${category === v ? PALETTE.navy : "#dde1e7"}`, background: category === v ? PALETTE.navy : "#fff", color: category === v ? "#fff" : PALETTE.navy }}>{l}</button>))}
              </div>
              <Field placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} />
              {category === "event" && (<div style={{ marginBottom: 14 }}><label style={{ fontSize: 12, color: "#67707f", display: "block", marginBottom: 6 }}>Event date</label><input type="date" value={eventDate} onChange={e => setEventDate(e.target.value)} style={{ width: "100%", boxSizing: "border-box", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", fontSize: 14.5, fontFamily: "inherit" }} /></div>)}
              <textarea value={body} onChange={e => setBody(e.target.value)} rows={4} placeholder="Details..." style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginBottom: 14, fontFamily: "inherit", fontSize: 13.5 }} />
              <Field placeholder="Optional link (e.g. poster image, Instagram post, form)" value={link} onChange={e => setLink(e.target.value)} />
              <div style={{ display: "flex", gap: 8 }}><Button onClick={postAnnouncement} variant="primary">Post</Button><Button variant="ghost" onClick={() => setShowForm(false)}>Cancel</Button></div>
            </Card>
          )}
        </div>
      )}
      {filtered.length === 0 ? <Card><p style={{ fontSize: 13.5, color: "#8a94a6" }}>Nothing posted yet.</p></Card> : (
        <div style={{ display: "grid", gap: 10 }}>
          {filtered.map((a) => (
            <Card key={a.id}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
                <div style={{ display: "flex", gap: 10, flex: 1, minWidth: 0 }}>
                  <Badge tone={a.category === "event" ? "teal" : "navy"}>{a.category === "event" ? "Event" : "News"}</Badge>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15, fontWeight: 600 }}>{a.title}</div>
                    <div style={{ fontSize: 11.5, color: "#8a94a6", marginTop: 2 }}>{a.category === "event" && a.eventDate ? `${a.eventDate} • ` : ""}Posted by {a.by} • {new Date(a.date).toLocaleDateString()}</div>
                  </div>
                </div>
                {session?.role === "admin" && <button onClick={() => deleteAnnouncement(a.id)} style={{ background: "#fff", border: `1px solid ${PALETTE.coral}`, color: PALETTE.coral, borderRadius: 8, padding: "6px 8px", cursor: "pointer" }}><Ic n="trash" size={12} /></button>}
              </div>
              <p style={{ fontSize: 13.5, color: "#3a4353", marginTop: 10, lineHeight: 1.6 }}>{a.body}</p>
              {a.link && <a href={a.link} target="_blank" rel="noreferrer" style={{ display: "inline-block", marginTop: 8 }}><Button variant="gold" style={{ padding: "6px 12px", fontSize: 12.5 }}>Open Link</Button></a>}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- About ---------------- */
function AboutPage({ info }) {
  return (
    <div style={{ maxWidth: 700, margin: "0 auto" }}>
      <h2 style={{ fontSize: 22, marginBottom: 16 }}>About Lumumba Secondary School</h2>
      <Card style={{ marginBottom: 14 }}><h3 style={{ fontSize: 15, marginBottom: 8 }}>Overview</h3><p style={{ fontSize: 14, lineHeight: 1.7, color: "#3a4353" }}>{info.about}</p></Card>
      <Card style={{ marginBottom: 14 }}><h3 style={{ fontSize: 15, marginBottom: 8 }}>History</h3><p style={{ fontSize: 14, lineHeight: 1.7, color: "#3a4353" }}>{info.history}</p></Card>
      <Card><h3 style={{ fontSize: 15, marginBottom: 8 }}>Contact</h3><p style={{ fontSize: 14, lineHeight: 1.7, color: "#3a4353" }}>{info.contacts}</p></Card>

  );
}

/* ---------------- Admin ---------------- */
function AdminPage({ session, schoolInfo, setSchoolInfo }) {
  const [tab, setTab] = useState("pending");
  const [pending, setPending] = useState([]); const [approvedUsers, setApprovedUsers] = useState([]); const [loadingUsers, setLoadingUsers] = useState(false);
  const [resStudentId, setResStudentId] = useState(""); const [resSubject, setResSubject] = useState(""); const [resMarks, setResMarks] = useState("");
  const [resGrade, setResGrade] = useState("A"); const [resTerm, setResTerm] = useState("Term I"); const [resMsg, setResMsg] = useState(null);
  const [aboutTxt, setAboutTxt] = useState(schoolInfo?.about || ""); const [historyTxt, setHistoryTxt] = useState(schoolInfo?.history || ""); const [contactsTxt, setContactsTxt] = useState(schoolInfo?.contacts || "");
  const [rosterText, setRosterText] = useState(""); const [rosterCount, setRosterCount] = useState(0); const [rosterMsg, setRosterMsg] = useState(null);

  const loadUsers = useCallback(async () => {
    setLoadingUsers(true);
    const snap = await db.collection("users").get();
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    setPending(all.filter(u => u.status === "pending"));
    setApprovedUsers(all.filter(u => u.status === "approved"));
    setLoadingUsers(false);
  }, []);
  useEffect(() => {
    loadUsers();
    (async () => { const s = await db.collection("roster").get(); setRosterCount(s.size); })();
  }, [loadUsers]);

  async function setStatus(user, status) {
    const updates = { status };
    if (status === "approved" && !user.schoolEmail) {
      const base = slugify(user.fullName).replace(/-/g, ".") || slugify(user.regNumber);
      updates.schoolEmail = `${base}@lumumba.ac.tz`;
    }
    await db.collection("users").doc(user.id).update(updates);
    await loadUsers();
  }

  async function submitResult() {
    setResMsg(null);
    if (!resStudentId || !resSubject || !resMarks) { setResMsg({ t: "err", m: "Fill in all fields." }); return; }
    const ref = db.collection("results").doc(resStudentId);
    const doc = await ref.get();
    const items = doc.exists ? (doc.data().items || []) : [];
    items.unshift({ subject: resSubject, marks: resMarks, grade: resGrade, term: resTerm, date: Date.now() });
    await ref.set({ items });
    setResMsg({ t: "ok", m: "Result saved. The student will see it on their dashboard." });
    setResSubject(""); setResMarks("");
  }

  async function saveSchoolInfo() {
    const info = { about: aboutTxt, history: historyTxt, contacts: contactsTxt };
    await db.collection("meta").doc("schoolInfo").set(info);
    setSchoolInfo(info);
  }

  async function saveRoster(mode) {
    setRosterMsg(null);
    const lines = rosterText.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) { setRosterMsg({ t: "err", m: "Paste at least one row first." }); return; }
    if (mode === "replace") {
      const existing = await db.collection("roster").get();
      const batchDel = db.batch();
      existing.docs.forEach(d => batchDel.delete(d.ref));
      await batchDel.commit();
    }
    const batch = db.batch();
    let count = 0;
    for (const line of lines) {
      const parts = line.split(",").map(p => p.trim());
      if (parts.length < 3) continue;
      const [fullName, regNumber, role, form] = parts;
      if (!fullName || !regNumber || !["student", "teacher"].includes(role.toLowerCase())) continue;
      const ref = db.collection("roster").doc();
      batch.set(ref, { fullName, regNumber, role: role.toLowerCase(), form: form || "" });
      count++;
    }
    if (count === 0) { setRosterMsg({ t: "err", m: "Could not read any valid rows. Use: Full Name, RegNumber, student/teacher, Form" }); return; }
    await batch.commit();
    const s = await db.collection("roster").get();
    setRosterCount(s.size);
    setRosterMsg({ t: "ok", m: `Saved. ${count} rows added (roster now has ${s.size} people).` });
    setRosterText("");
  }

  const students = approvedUsers.filter(u => u.role === "student");
  const tabs = [
    { key: "pending", label: `Approvals (${pending.length})`, icon: "shield" }, { key: "users", label: "Users", icon: "user" },
    { key: "roster", label: `Roster (${rosterCount})`, icon: "roster" }, { key: "results", label: "Results", icon: "award" },
    { key: "info", label: "School Info", icon: "info" },
  ];

  return (
    <div>
      <h2 style={{ fontSize: 22, marginBottom: 6 }}>Admin Panel</h2>
      <p style={{ fontSize: 13, color: "#8a94a6", marginBottom: 18 }}>Logged in as <strong>Super Admin</strong> — {session.fullName}</p>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {tabs.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={{ padding: "8px 14px", borderRadius: 20, border: `1.5px solid ${tab === t.key ? PALETTE.navy : "#dde1e7"}`, background: tab === t.key ? PALETTE.navy : "#fff", color: tab === t.key ? "#fff" : PALETTE.navy, cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Ic n={t.icon} size={13} /> {t.label}</button>)}
      </div>

      {tab === "pending" && (
        <div>
          <p style={{ fontSize: 12, color: "#8a94a6", marginBottom: 12 }}>Approving someone issues them an official-looking school email for display (name@lumumba.ac.tz).</p>
          {loadingUsers ? <p style={{ fontSize: 13.5, color: "#8a94a6" }}>Loading...</p> : pending.length === 0 ? <Card><p style={{ fontSize: 13.5, color: "#8a94a6" }}>No accounts awaiting approval right now.</p></Card> : (
            <div style={{ display: "grid", gap: 10 }}>
              {pending.map(u => (
                <Card key={u.id} style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <div style={{ width: 42, height: 42, borderRadius: "50%", overflow: "hidden", background: "#eee", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>{u.photoURL ? <img src={u.photoURL} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Ic n="user" size={17} />}</div>
                  <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 600, fontSize: 14 }}>{u.fullName}</div><div style={{ fontSize: 12, color: "#8a94a6" }}>{u.role === "student" ? "Student" : "Teacher"} • {u.regNumber} • {u.form}</div></div>
                  <button onClick={() => setStatus(u, "approved")} style={{ background: PALETTE.teal, border: "none", color: "#fff", borderRadius: 8, padding: "8px 10px", cursor: "pointer" }}><Ic n="check" size={13} /></button>
                  <button onClick={() => setStatus(u, "rejected")} style={{ background: "#fff", border: `1px solid ${PALETTE.coral}`, color: PALETTE.coral, borderRadius: 8, padding: "8px 10px", cursor: "pointer" }}><Ic n="x" size={13} /></button>
                </Card>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === "users" && (
        <div style={{ display: "grid", gap: 8 }}>
          {approvedUsers.length === 0 ? <Card><p style={{ fontSize: 13.5, color: "#8a94a6" }}>No approved users yet.</p></Card> : approvedUsers.map(u => (
            <Card key={u.id} style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", overflow: "hidden", background: "#eee", flexShrink: 0 }}>{u.photoURL && <img src={u.photoURL} style={{ width: "100%", height: "100%", objectFit: "cover" }} />}</div>
              <div style={{ flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600 }}>{u.fullName}</div><div style={{ fontSize: 11.5, color: "#8a94a6" }}>{u.regNumber} • {u.schoolEmail || "school email pending"} • {u.phone || "—"}</div></div>
              <Badge tone={u.role === "admin" ? "coral" : u.role === "teacher" ? "teal" : "navy"}>{u.role}</Badge>
            </Card>
          ))}
        </div>
      )}

      {tab === "roster" && (
        <Card>
          <h3 style={{ fontSize: 15, marginBottom: 6 }}>Official Roster</h3>
          <p style={{ fontSize: 12.5, color: "#8a94a6", marginBottom: 12 }}>Paste one person per line: <code>Full Name, Registration Number, student or teacher, Form</code><br />Example: <code>Amina Juma Ali, LSS-2026-0231, student, Form II</code></p>
          {rosterMsg && <div style={{ padding: "9px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13, background: rosterMsg.t === "ok" ? "#dbeaf5" : "#f6dedb", color: rosterMsg.t === "ok" ? "#124a72" : "#8f2f27" }}>{rosterMsg.m}</div>}
          <textarea value={rosterText} onChange={e => setRosterText(e.target.value)} rows={8} placeholder={"Amina Juma Ali, LSS-2026-0231, student, Form II\nHassan Omar Khamis, TCH-014, teacher,"} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginBottom: 12, fontFamily: "monospace", fontSize: 12.5 }} />
          <div style={{ display: "flex", gap: 8 }}><Button variant="primary" onClick={() => saveRoster("append")}>Add to Roster</Button><Button variant="ghost" onClick={() => saveRoster("replace")}>Replace Whole Roster</Button></div>
          <p style={{ fontSize: 11.5, color: "#8a94a6", marginTop: 10 }}>Current roster size: {rosterCount} people.</p>
        </Card>
      )}

      {tab === "results" && (
        <Card>
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Submit / Add Results</h3>
          {resMsg && <div style={{ padding: "9px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13, background: resMsg.t === "ok" ? "#dbeaf5" : "#f6dedb", color: resMsg.t === "ok" ? "#124a72" : "#8f2f27" }}>{resMsg.m}</div>}
          <select value={resStudentId} onChange={e => setResStudentId(e.target.value)} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginBottom: 14, fontSize: 14 }}>
            <option value="">-- Select Student --</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.fullName} ({s.regNumber})</option>)}
          </select>
          <Field placeholder="Subject (e.g. Mathematics)" value={resSubject} onChange={e => setResSubject(e.target.value)} />
          <Field placeholder="Marks (e.g. 78)" value={resMarks} onChange={e => setResMarks(e.target.value)} />
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            <select value={resGrade} onChange={e => setResGrade(e.target.value)} style={{ flex: 1, padding: 12, borderRadius: 8, border: "1px solid #d9dde4" }}>{["A", "B", "C", "D", "F"].map(g => <option key={g}>{g}</option>)}</select>
            <select value={resTerm} onChange={e => setResTerm(e.target.value)} style={{ flex: 1, padding: 12, borderRadius: 8, border: "1px solid #d9dde4" }}>{["Term I", "Term II", "Annual Exam"].map(t => <option key={t}>{t}</option>)}</select>
          </div>
          <Button onClick={submitResult} variant="primary">Save Result</Button>
        </Card>
      )}

      {tab === "info" && (
        <Card>
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Edit School Information</h3>
          <label style={{ fontSize: 12, color: "#8a94a6" }}>Overview</label>
          <textarea value={aboutTxt} onChange={e => setAboutTxt(e.target.value)} rows={4} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginTop: 6, marginBottom: 14, fontFamily: "inherit", fontSize: 13.5 }} />
          <label style={{ fontSize: 12, color: "#8a94a6" }}>History</label>
          <textarea value={historyTxt} onChange={e => setHistoryTxt(e.target.value)} rows={4} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginTop: 6, marginBottom: 14, fontFamily: "inherit", fontSize: 13.5 }} />
          <label style={{ fontSize: 12, color: "#8a94a6" }}>Contact</label>
          <textarea value={contactsTxt} onChange={e => setContactsTxt(e.target.value)} rows={2} style={{ width: "100%", padding: 12, borderRadius: 8, border: "1px solid #d9dde4", marginTop: 6, marginBottom: 14, fontFamily: "inherit", fontSize: 13.5 }} />
          <Button onClick={saveSchoolInfo} variant="primary">Save Info</Button>
        </Card>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
